<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H.O.L.M.E.S. ARCHIVE SYSTEM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050b05;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* CRT Scanline and Glow Effect */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    .terminal-container {
      max-width: 900px;
      margin: 0 auto;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .input-line {
      display: flex;
      align-items: center;
    }

    .prompt {
      margin-right: 10px;
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      color: #00ff66;
      font-family: inherit;
      font-size: inherit;
      width: 100%;
      outline: none;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
    }

    /* Loading Bar Styles */
    .loading-container {
      margin: 10px 0;
    }

    .loading-border {
      border: 1px solid #00ff66;
      padding: 3px;
      width: 320px;
      box-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
    }

    .loading-bar {
      height: 16px;
      background-color: #00ff66;
      width: 0%;
      box-shadow: 0 0 8px #00ff66;
    }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="terminal-container">
    <div id="output"></div>
    <div class="input-line">
      <span class="prompt">&gt;</span>
      <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>
  <input type="file" id="import-file" style="display: none;" accept=".json">
  <input type="file" id="attach-files" style="display: none;" multiple>
  <input type="file" id="edit-file-input" style="display: none;" multiple>

  <script>
    let __loopProtection = true;
    function disableLoopProtection() {
      __loopProtection = false;
    }

    const __loopProtector = (function () {
      const maxIterationsOverall = 1_000_000;
      let counter = 0;
      return function () {
        if (__loopProtection) {
          if (counter > maxIterationsOverall) {
            throw new Error('Infinite loop detected.');
          }
          counter++;
        }
      }
    })();

    // Initial State & Data Persistence
    let database = JSON.parse(localStorage.getItem('HOLMES_DB')) || [{
      id: "REC-001",
      title: "Project HOLMES Initialization",
      category: "SYSTEM",
      details: "Core archive terminal online. Local storage active.",
      attachments: []
    }];

    let entryMode = false;
    let editMode = false;
    let targetEditIndex = -1;
    let tempEntry = {};
    let entryStep = 0;
    let editSubStep = '';
    let isProcessing = false;

    const MAX_SINGLE_FILE_SIZE = 2 * 1024 * 1024; // 2 MB size cap per file

    const output = document.getElementById('output');
    const input = document.getElementById('command-input');
    const fileInput = document.getElementById('import-file');
    const attachInput = document.getElementById('attach-files');
    const editFileInput = document.getElementById('edit-file-input');

    // Boot Sequence Output
    printLine("==================================================");
    printLine("  H.O.L.M.E.S. ARCHIVE SYSTEM - V3.3");
    printLine("  SELECTIVE FIELD EDITING & FILE MANAGEMENT ONLINE.");
    printLine("  TYPE 'HELP' FOR COMMAND DIRECTORY.");
    printLine("==================================================\n");

    // Keep focus on terminal input
    document.addEventListener('click', () => {
      if (!isProcessing) input.focus();
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (isProcessing) return;
        const value = input.value.trim();
        printLine(`> ${value}`);
        input.value = '';
        if (entryMode) {
          handleAddProcess(value);
        } else if (editMode) {
          handleEditProcess(value);
        } else {
          processCommand(value);
        }
        window.scrollTo(0, document.body.scrollHeight);
      }
    });

    function printLine(text) {
      const line = document.createElement('div');
      line.textContent = text;
      output.appendChild(line);
    }

    function saveData() {
      try {
        const payload = JSON.stringify(database);
        localStorage.setItem('HOLMES_DB', payload);
        // Force cross-tab sync alert event
        window.dispatchEvent(new Event('storage'));
      } catch (e) {
        printLine("--------------------------------------------------");
        printLine("CRITICAL ERROR: LOCAL STORAGE QUOTA EXCEEDED.");
        printLine("UNABLE TO SAVE RECORD. PLEASE DELETE OLD FILES.");
        printLine("--------------------------------------------------");
      }
    }

    // Main Command Processor
    function processCommand(cmdStr) {
      const parts = cmdStr.split(' ');
      const command = parts[0].toUpperCase();
      const args = parts.slice(1).join(' ');

      switch (command) {
        case 'HELP':
          printLine("COMMANDS:");
          printLine("  LIST                - List all categories and item counts");
          printLine("  VIEWCATEGORY <name> - View all records within a category");
          printLine("  SEARCH <query>      - Search titles, categories, and details");
          printLine("  VIEW <id>           - View full record details");
          printLine("  VIEWIMG <id> [i]    - Load and launch image in new tab");
          printLine("  PLAYVIDEO <id> [i]  - Load and launch video in new tab");
          printLine("  VIEWPDF <id> [i]    - Load and launch PDF in new tab");
          printLine("  DOWNLOAD <id> [i]   - Download file (Optional: attachment index #)");
          printLine("  ADD                 - Launch interactive prompt to create entry");
          printLine("  EDIT <id>           - Interactively edit record fields or attachments");
          printLine("  DELETE <id>         - Remove a record by ID");
          printLine("  EXPORT / IMPORT     - Save or restore database JSON file");
          printLine("  MONITOR             - Launch live Auxiliary Monitor in new tab");
          printLine("  CLEAR               - Clear terminal screen");
          break;

        case 'LIST':
          showLoadingBar("FETCHING CATEGORIES DIRECTORY", () => {
            if (database.length === 0) {
              printLine("NO RECORDS FOUND IN ARCHIVE.");
            } else {
              const categoryCounts = {};
              database.forEach(item => {
                const cat = item.category ? item.category.toUpperCase() : "UNASSIGNED";
                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
              });

              printLine("--------------------------------------------------");
              printLine("ARCHIVE CATEGORIES DIRECTORY:");
              printLine("--------------------------------------------------");
              Object.keys(categoryCounts).forEach(cat => {
                printLine(`  CATEGORY: ${cat.padEnd(20)} [${categoryCounts[cat]} RECORD(S)]`);
              });
              printLine("--------------------------------------------------");
              printLine("USE 'VIEWCATEGORY <name>' TO VIEW ENTRIES IN A CATEGORY.");
            }
          });
          break;

        case 'VIEWCATEGORY':
          if (!args) {
            printLine("ERROR: Specify category name. Usage: VIEWCATEGORY <name>");
            return;
          }
          const catQuery = args.toUpperCase();
          showLoadingBar(`SCANNING CATEGORY [${catQuery}]`, () => {
            const categoryMatches = database.filter(item => 
              (item.category && item.category.toUpperCase() === catQuery)
            );

            if (categoryMatches.length === 0) {
              printLine(`NO RECORDS FOUND UNDER CATEGORY '${catQuery}'.`);
            } else {
              printLine("--------------------------------------------------");
              printLine(`CATEGORY: ${catQuery} (${categoryMatches.length} RECORDS FOUND)`);
              printLine("--------------------------------------------------");
              categoryMatches.forEach(item => {
                const files = item.attachments || [];
                const fileTag = files.length > 0 ? ` [FILES: ${files.length}]` : '';
                printLine(`[${item.id}] ${item.title}${fileTag}`);
              });
              printLine("--------------------------------------------------");
            }
          });
          break;

        case 'SEARCH':
          if (!args) {
            printLine("ERROR: Specify search query. Usage: SEARCH <query>");
            return;
          }
          showLoadingBar(`SEARCHING ARCHIVE FOR [${args.toUpperCase()}]`, () => {
            const matches = database.filter(item => 
              item.title.toLowerCase().includes(args.toLowerCase()) || 
              item.category.toLowerCase().includes(args.toLowerCase()) || 
              item.details.toLowerCase().includes(args.toLowerCase())
            );
            printLine(`FOUND ${matches.length} RECORD(S):`);
            matches.forEach(m => printLine(`[${m.id}] ${m.title} (${m.category})`));
          });
          break;

        case 'VIEW':
          if (!args) {
            printLine("ERROR: Specify Record ID. Usage: VIEW <id>");
            return;
          }
          showLoadingBar(`RETRIEVING RECORD [${args.toUpperCase()}]`, () => {
            const target = database.find(item => item.id.toUpperCase() === args.toUpperCase());
            if (!target) {
              printLine("ERROR: Record ID not found.");
            } else {
              printLine("--------------------------------------------------");
              printLine(`ID:         ${target.id}`);
              printLine(`TITLE:      ${target.title}`);
              printLine(`CATEGORY:   ${target.category}`);
              printLine("--------------------------------------------------");
              printLine(`DETAILS:\n${target.details}`);
              printLine("--------------------------------------------------");
              const files = target.attachments || [];
              if (files.length === 0) {
                printLine("ATTACHMENTS: NONE");
              } else {
                printLine(`ATTACHMENTS (${files.length}):`);
                files.forEach((f, index) => {
                  printLine(`  [${index + 1}] ${f.fileName} (${f.fileType})`);
                });
              }
              printLine("--------------------------------------------------");
            }
          });
          break;

        case 'VIEWIMG':
          handleMediaLaunch(args, 'image');
          break;

        case 'PLAYVIDEO':
          handleMediaLaunch(args, 'video');
          break;

        case 'VIEWPDF':
          handleMediaLaunch(args, 'pdf');
          break;

        case 'DOWNLOAD':
          const dlParts = args.split(' ');
          const recId = dlParts[0];
          const fileIndex = dlParts[1] ? parseInt(dlParts[1], 10) - 1 : 0;

          if (!recId) {
            printLine("ERROR: Specify Record ID. Usage: DOWNLOAD <id> [index]");
            return;
          }

          showLoadingBar(`PREPARING DOWNLOAD [${recId.toUpperCase()}]`, () => {
            const fileTarget = database.find(item => item.id.toUpperCase() === recId.toUpperCase());
            if (!fileTarget) {
              printLine("ERROR: Record ID not found.");
            } else if (!fileTarget.attachments || fileTarget.attachments.length === 0) {
              printLine("ERROR: Selected record has no attached files.");
            } else if (!fileTarget.attachments[fileIndex]) {
              printLine(`ERROR: Invalid attachment index. Available: 1 to ${fileTarget.attachments.length}`);
            } else {
              const att = fileTarget.attachments[fileIndex];
              const dlAnchor = document.createElement('a');
              dlAnchor.href = att.fileData;
              dlAnchor.download = att.fileName;
              document.body.appendChild(dlAnchor);
              dlAnchor.click();
              dlAnchor.remove();
              printLine(`SUCCESS: DOWNLOADING [${att.fileName}]`);
            }
          });
          break;

        case 'ADD':
          showLoadingBar("INITIALIZING ADD SEQUENCE", () => {
            entryMode = true;
            entryStep = 1;
            tempEntry = { attachments: [] };
            printLine("[ADD MODE] Enter Record Title:");
          });
          break;

        case 'EDIT':
          if (!args) {
            printLine("ERROR: Specify Record ID. Usage: EDIT <id>");
            return;
          }
          const editIdx = database.findIndex(item => item.id.toUpperCase() === args.toUpperCase());
          if (editIdx === -1) {
            printLine("ERROR: Record ID not found.");
            return;
          }
          showLoadingBar(`FETCHING RECORD [${args.toUpperCase()}] FOR EDITING`, () => {
            editMode = true;
            targetEditIndex = editIdx;
            tempEntry = JSON.parse(JSON.stringify(database[editIdx])); // Clone record
            if (!tempEntry.attachments) tempEntry.attachments = [];
            entryStep = 0; // Main edit menu
            showEditMenu();
          });
          break;

        case 'DELETE':
          if (!args) {
            printLine("ERROR: Specify Record ID. Usage: DELETE <id>");
            return;
          }
          showLoadingBar(`PURGING RECORD [${args.toUpperCase()}]`, () => {
            const initialCount = database.length;
            database = database.filter(item => item.id.toUpperCase() !== args.toUpperCase());
            if (database.length < initialCount) {
              saveData();
              printLine(`RECORD ${args.toUpperCase()} DELETED SUCCESSFULLY.`);
            } else {
              printLine("ERROR: Record ID not found.");
            }
          });
          break;

        case 'EXPORT':
          showLoadingBar("ENCRYPTING & EXPORTING DATABASE", () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(database, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `holmes_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            printLine("DATABASE EXPORTED SUCCESSFULLY.");
          });
          break;

        case 'IMPORT':
          fileInput.click();
          break;

        case 'MONITOR':
          showLoadingBar("INITIALIZING AUXILIARY MONITOR FEED", () => {
            openAuxiliaryMonitorTab();
          });
          break;

        case 'CLEAR':
          output.innerHTML = '';
          break;

        case '':
          break;

        default:
          printLine(`UNKNOWN COMMAND: '${command}'. TYPE 'HELP' FOR COMMANDS.`);
      }
    }

    // Display Edit Options Menu
    function showEditMenu() {
      printLine("--------------------------------------------------");
      printLine(`[EDIT MODE: ${tempEntry.id}] SELECT FIELD TO MODIFY:`);
      printLine("  1 - Title");
      printLine("  2 - Category");
      printLine("  3 - Details");
      printLine("  4 - File Attachments (Add / Remove / Replace)");
      printLine("--------------------------------------------------");
      printLine("Enter selection (1-4):");
    }

    // Interactive EDIT Handler with Field Selection
    function handleEditProcess(inputVal) {
      if (entryStep === 0) {
        // Selection step
        switch (inputVal) {
          case '1':
            entryStep = 1;
            printLine(`Current Title: ${tempEntry.title}`);
            printLine("Enter New Title:");
            break;
          case '2':
            entryStep = 2;
            printLine(`Current Category: ${tempEntry.category}`);
            printLine("Enter New Category:");
            break;
          case '3':
            entryStep = 3;
            printLine(`Current Details: ${tempEntry.details}`);
            printLine("Enter New Details:");
            break;
          case '4':
            entryStep = 4;
            printLine("--------------------------------------------------");
            printLine("FILE ATTACHMENTS MANAGEMENT:");
            printLine(`Current Attachments (${tempEntry.attachments.length}):`);
            if (tempEntry.attachments.length === 0) {
              printLine("  [No attachments present]");
            } else {
              tempEntry.attachments.forEach((f, idx) => {
                printLine(`  [${idx + 1}] ${f.fileName} (${f.fileType})`);
              });
            }
            printLine("--------------------------------------------------");
            printLine("Choose File Action:");
            printLine("  1 - ADD File(s)");
            printLine("  2 - REMOVE File");
            printLine("  3 - REPLACE All Files");
            printLine("Enter selection (1-3):");
            break;
          default:
            printLine("INVALID CHOICE. Enter 1, 2, 3, or 4:");
        }
      } else if (entryStep === 1) {
        if (inputVal.trim() !== '') {
          tempEntry.title = inputVal.trim();
        }
        commitRecordChanges();
      } else if (entryStep === 2) {
        if (inputVal.trim() !== '') {
          tempEntry.category = inputVal.trim().toUpperCase();
        }
        commitRecordChanges();
      } else if (entryStep === 3) {
        if (inputVal.trim() !== '') {
          tempEntry.details = inputVal.trim();
        }
        commitRecordChanges();
      } else if (entryStep === 4) {
        // File action menu selection
        if (inputVal === '1') {
          editSubStep = 'ADD';
          editFileInput.multiple = true;
          editFileInput.click();
        } else if (inputVal === '2') {
          if (tempEntry.attachments.length === 0) {
            printLine("ERROR: No attachments available to remove.");
            entryStep = 0;
            showEditMenu();
            return;
          }
          entryStep = 5; // Sub-step: enter index to remove
          printLine(`Enter Attachment Index to Remove (1 to ${tempEntry.attachments.length}):`);
        } else if (inputVal === '3') {
          editSubStep = 'REPLACE';
          editFileInput.multiple = true;
          editFileInput.click();
        } else {
          printLine("INVALID CHOICE. Enter 1, 2, or 3:");
        }
      } else if (entryStep === 5) {
        // Handle specific attachment index removal
        const fileIdx = parseInt(inputVal, 10) - 1;
        if (!isNaN(fileIdx) && tempEntry.attachments[fileIdx]) {
          const removedName = tempEntry.attachments[fileIdx].fileName;
          tempEntry.attachments.splice(fileIdx, 1);
          printLine(`REMOVED ATTACHMENT: [${removedName}]`);
          commitRecordChanges();
        } else {
          printLine(`INVALID INDEX. Specify a number from 1 to ${tempEntry.attachments.length}:`);
        }
      }
    }

    // Save edited record to main database
    function commitRecordChanges() {
      showLoadingBar("SAVING RECORD CHANGES", () => {
        database[targetEditIndex] = tempEntry;
        saveData();
        printLine(`[SUCCESS] RECORD ${tempEntry.id} UPDATED SUCCESSFULLY.`);
        editMode = false;
        entryStep = 0;
        editSubStep = '';
        targetEditIndex = -1;
        tempEntry = {};
      });
    }

    // Dedicated File Attachment Handler for Editing
    editFileInput.addEventListener('change', e => {
      const files = Array.from(e.target.files);
      editFileInput.value = '';

      if (files.length === 0) {
        printLine("CANCELLED: No file selected.");
        entryStep = 0;
        showEditMenu();
        return;
      }

      showLoadingBar("PROCESSING ATTACHMENT(S)", () => {
        if (editSubStep === 'REPLACE') {
          tempEntry.attachments = []; // Clear existing files
        }

        let loadedCount = 0;
        files.forEach(file => {
          if (file.size > MAX_SINGLE_FILE_SIZE) {
            printLine("--------------------------------------------------");
            printLine(`ERROR: SKIPPING [${file.name}] - FILE TOO BIG.`);
            printLine(`MAX ALLOWED: 2.00 MB | FILE SIZE: ${(file.size / (1024 * 1024)).toFixed(2)} MB`);
            printLine("--------------------------------------------------");
            loadedCount++;
            if (loadedCount === files.length) commitRecordChanges();
            return;
          }

          const reader = new FileReader();
          reader.onload = event => {
            tempEntry.attachments.push({
              fileName: file.name,
              fileType: file.type || 'application/octet-stream',
              fileData: event.target.result
            });
            printLine(`[ATTACHED] ${file.name} (${Math.round(file.size / 1024)} KB)`);
            loadedCount++;
            if (loadedCount === files.length) {
              commitRecordChanges();
            }
          };
          reader.readAsDataURL(file);
        });
      });
    });

    // Prepares the media item and triggers the loading process
    function handleMediaLaunch(recordId, type) {
      const parts = recordId.split(' ');
      const recId = parts[0];
      const targetIndex = parts[1] ? parseInt(parts[1], 10) - 1 : 0;

      if (!recId) {
        printLine(`ERROR: Specify Record ID. Usage: ${type.toUpperCase()} <id>`);
        return;
      }

      const record = database.find(item => item.id.toUpperCase() === recId.toUpperCase());
      if (!record) {
        printLine("ERROR: Record ID not found.");
        return;
      }

      const files = record.attachments || [];
      if (files.length === 0) {
        printLine("ERROR: Record has no attachments.");
        return;
      }

      const attachment = files[targetIndex];
      if (!attachment) {
        printLine(`ERROR: Invalid attachment index. Choose 1 to ${files.length}`);
        return;
      }

      showLoadingBar(`DECRYPTING & LOADING [${attachment.fileName}]`, () => {
        openFileInRetroTab(record, attachment, type);
      });
    }

    // Universal Terminal Retro Loading Animation Bar
    function showLoadingBar(taskLabel, callback) {
      isProcessing = true;
      input.disabled = true;

      const container = document.createElement('div');
      container.className = 'loading-container';

      const label = document.createElement('div');
      label.textContent = `${taskLabel}... 0%`;

      const border = document.createElement('div');
      border.className = 'loading-border';

      const bar = document.createElement('div');
      bar.className = 'loading-bar';

      border.appendChild(bar);
      container.appendChild(label);
      container.appendChild(border);
      output.appendChild(container);

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 18) + 8;
        if (progress >= 100) {
          progress = 100;
          bar.style.width = '100%';
          label.textContent = `${taskLabel}... 100% [COMPLETE]`;
          clearInterval(interval);
          setTimeout(() => {
            isProcessing = false;
            input.disabled = false;
            input.focus();
            if (callback) callback();
          }, 250);
        } else {
          bar.style.width = `${progress}%`;
          label.textContent = `${taskLabel}... ${progress}%`;
        }
        window.scrollTo(0, document.body.scrollHeight);
      }, 70);
    }

    // Opens live auxiliary dashboard tab
    function openAuxiliaryMonitorTab() {
      const auxTab = window.open('', '_blank');
      if (!auxTab) {
        printLine("ERROR: POPUP BLOCKED BY BROWSER. ALLOW POPUPS TO LAUNCH MONITOR.");
        return;
      }

      const auxHTML = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>H.O.L.M.E.S. - Auxiliary Field Monitor</title>
          <style>
            :root {
              --green-bright: #00ff66;
              --green-dim: #005522;
              --green-mid: #00aa44;
              --bg-color: #030803;
              --panel-bg: rgba(4, 16, 8, 0.90);
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              background-color: var(--bg-color);
              color: var(--green-bright);
              font-family: 'Courier New', Courier, monospace;
              padding: 20px;
              min-height: 100vh;
              display: grid;
              grid-template-rows: auto 1fr auto;
              gap: 20px;
            }
            body::before {
              content: " ";
              position: fixed;
              top: 0; left: 0; bottom: 0; right: 0;
              background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                          linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
              z-index: 100;
              background-size: 100% 3px, 6px 100%;
              pointer-events: none;
            }
            header {
              border: 1px solid var(--green-mid);
              padding: 15px;
              background: var(--panel-bg);
              display: flex;
              justify-content: space-between;
              align-items: center;
            }
            .status-tag {
              background: var(--green-dim);
              color: var(--green-bright);
              padding: 4px 8px;
              font-weight: bold;
              border: 1px solid var(--green-bright);
            }
            main {
              display: grid;
              grid-template-columns: 2fr 1fr;
              gap: 20px;
            }
            .panel {
              border: 1px solid var(--green-dim);
              background: var(--panel-bg);
              padding: 15px;
              display: flex;
              flex-direction: column;
            }
            .panel-title {
              border-bottom: 1px solid var(--green-dim);
              padding-bottom: 5px;
              margin-bottom: 15px;
              font-weight: bold;
            }
            .feed-list {
              flex-grow: 1;
              overflow-y: auto;
              display: flex;
              flex-direction: column;
              gap: 10px;
              max-height: 520px;
            }
            .record-card {
              border: 1px dashed var(--green-mid);
              padding: 10px;
              background: rgba(0, 255, 102, 0.02);
            }
            .record-card header {
              border: none;
              padding: 0;
              margin-bottom: 5px;
              font-size: 0.8em;
              color: var(--green-mid);
            }
            .attach-btn {
              background: transparent;
              border: 1px solid var(--green-bright);
              color: var(--green-bright);
              font-family: inherit;
              padding: 4px 8px;
              margin-top: 8px;
              cursor: pointer;
              font-size: 0.8em;
            }
            .attach-btn:hover {
              background: var(--green-bright);
              color: var(--bg-color);
            }
            .attach-list {
              margin-top: 8px;
              padding-top: 8px;
              border-top: 1px dotted var(--green-dim);
              display: none;
            }
            .file-link {
              color: var(--green-bright);
              cursor: pointer;
              text-decoration: underline;
              font-size: 0.85em;
              display: block;
              margin: 4px 0;
            }
            table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
            th, td { text-align: left; padding: 6px 0; border-bottom: 1px dashed var(--green-dim); }
            th { color: var(--green-mid); }
            footer {
              border-top: 1px solid var(--green-dim);
              padding-top: 10px;
              font-size: 0.8em;
              display: flex;
              justify-content: space-between;
              color: var(--green-mid);
            }
          </style>
        </head>
        <body>
          <header>
            <div>
              <h1>H.O.L.M.E.S. AUXILIARY MONITOR</h1>
              <small>LIVE STORAGE OVERWATCH</small>
            </div>
            <div class="status-tag">LINKED TO STORAGE</div>
          </header>
          <main>
            <section class="panel">
              <div class="panel-title">[ LIVE RECORD FEED ]</div>
              <div class="feed-list" id="feedList"></div>
            </section>
            <section class="panel">
              <div class="panel-title">[ METRICS ]</div>
              <div style="margin-bottom: 20px;">
                <small style="color: var(--green-mid);">TOTAL ARCHIVED RECORDS</small>
                <div style="font-size: 2em; font-weight: bold;" id="totalCount">0</div>
              </div>
              <div class="panel-title">[ CATEGORY DISTRIBUTION ]</div>
              <table>
                <thead>
                  <tr><th>CATEGORY</th><th style="text-align: right;">COUNT</th></tr>
                </thead>
                <tbody id="catTable"></tbody>
              </table>
            </section>
          </main>
          <footer>
            <span>STORAGE TARGET: HOLMES_DB</span>
            <span id="syncTime">LAST SYNC: --:--:--</span>
          </footer>
          <script>
            let currentDb = [];

            function toggleAttachments(index) {
              const el = document.getElementById('attachments-' + index);
              if (el) {
                el.style.display = el.style.display === 'block' ? 'none' : 'block';
              }
            }

            function openFileViewport(recIdx, fileIdx) {
              const record = currentDb[recIdx];
              const att = record.attachments[fileIdx];
              
              const newTab = window.open('', '_blank');
              if (!newTab) return alert("Popup blocked!");

              let contentElement = '';
              if (att.fileType.startsWith('image/')) {
                contentElement = \`<img src="\${att.fileData}" style="max-width:100%; max-height:65vh; border: 1px solid #00ff66;">\`;
              } else if (att.fileType.startsWith('video/')) {
                contentElement = \`<video controls src="\${att.fileData}" style="max-width:100%; max-height:65vh; border: 1px solid #00ff66;"></video>\`;
              } else {
                contentElement = \`<iframe src="\${att.fileData}" style="width:100%; height:65vh; border: 1px solid #00ff66;"></iframe>\`;
              }

              newTab.document.write(\`
                <!DOCTYPE html>
                <html>
                <head>
                  <title>H.O.L.M.E.S. VIEWPORT - \${att.fileName}</title>
                  <style>
                    body { background: #050b05; color: #00ff66; font-family: monospace; padding: 20px; text-align: center; }
                    .box { max-width: 900px; margin: 0 auto; }
                  </style>
                </head>
                <body>
                  <div class="box">
                    <h3>[VIEWPORT FILE: \${att.fileName}]</h3>
                    <p style="margin-bottom:15px; font-size:0.85em; color:#00aa44;">RECORD: \${record.id} - \${record.title}</p>
                    \${contentElement}
                  </div>
                </body>
                </html>
              \`);
              newTab.document.close();
            }

            function sync() {
              const raw = localStorage.getItem('HOLMES_DB');
              if (!raw) return;
              currentDb = JSON.parse(raw);
              const feed = document.getElementById('feedList');
              const catTable = document.getElementById('catTable');
              const totalCount = document.getElementById('totalCount');
              const syncTime = document.getElementById('syncTime');
              
              feed.innerHTML = '';
              catTable.innerHTML = '';
              const categories = {};

              currentDb.forEach((item, idx) => {
                const cat = (item.category || 'UNASSIGNED').toUpperCase();
                categories[cat] = (categories[cat] || 0) + 1;

                const files = item.attachments || [];
                let attachHTML = '';
                if (files.length > 0) {
                  const listItems = files.map((f, fileIdx) => \`
                    <span class="file-link" onclick="openFileViewport(\${idx}, \${fileIdx})">&gt; LAUNCH: \${f.fileName} (\${f.fileType})</span>
                  \`).join('');

                  attachHTML = \`
                    <button class="attach-btn" onclick="toggleAttachments(\${idx})">[VIEW ATTACHMENTS (\${files.length})]</button>
                    <div class="attach-list" id="attachments-\${idx}">\${listItems}</div>
                  \`;
                }

                const card = document.createElement('div');
                card.className = 'record-card';
                card.innerHTML = \`
                  <header>\${item.id} | CATEGORY: \${cat}</header>
                  <strong>\${item.title}</strong>
                  <p style="margin-top:4px; font-size:0.9em; color:#b3ffcc;">\${item.details}</p>
                  \${attachHTML}
                \`;
                feed.appendChild(card);
              });

              for (let [cat, count] of Object.entries(categories)) {
                const tr = document.createElement('tr');
                tr.innerHTML = \`<td>\${cat}</td><td style="text-align:right;">\${count}</td>\`;
                catTable.appendChild(tr);
              }

              totalCount.innerText = currentDb.length;
              syncTime.innerText = 'LAST SYNC: ' + new Date().toLocaleTimeString();
            }

            window.addEventListener('storage', sync);
            sync();
          <\/script>
        </body>
        </html>
      `;

      auxTab.document.open();
      auxTab.document.write(auxHTML);
      auxTab.document.close();
      printLine("SUCCESS: AUXILIARY MONITOR OPENED IN NEW TAB.");
    }

    // Opens file in a new window formatted in identical retro aesthetic with entry info
    function openFileInRetroTab(record, attachment, type) {
      const newTab = window.open('', '_blank');
      if (!newTab) {
        printLine("ERROR: POPUP BLOCKED BY BROWSER. ALLOW POPUPS TO VIEW FILES.");
        return;
      }

      let contentElement = '';
      if (type === 'image') {
        contentElement = `<img src="${attachment.fileData}" alt="${attachment.fileName}" style="max-width:100%; max-height:65vh; object-fit:contain; border: 1px solid #00ff66;">`;
      } else if (type === 'video') {
        contentElement = `<video controls src="${attachment.fileData}" style="max-width:100%; max-height:65vh; border: 1px solid #00ff66;"></video>`;
      } else if (type === 'pdf') {
        contentElement = `<iframe src="${attachment.fileData}#view=Fit&toolbar=0&navpanes=0" style="width:100%; height:65vh; border: 1px solid #00ff66;"></iframe>`;
      }

      // Build attachment list display
      const files = record.attachments || [];
      let fileListHTML = files.map((f, i) => `&nbsp;&nbsp;[${i + 1}] ${f.fileName} (${f.fileType})`).join('<br>');

      const retroPageHTML = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>H.O.L.M.E.S. VIEWPORT - ${record.id}</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              background-color: #050b05;
              color: #00ff66;
              font-family: 'Courier New', Courier, monospace;
              font-size: 15px;
              min-height: 100vh;
              padding: 20px;
              display: flex;
              flex-direction: column;
              align-items: center;
            }
            .crt-overlay {
              position: fixed;
              top: 0; left: 0;
              width: 100vw; height: 100vh;
              background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
              background-size: 100% 4px;
              pointer-events: none;
              z-index: 10;
            }
            .header {
              width: 100%;
              max-width: 900px;
              margin-bottom: 15px;
              text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
              border-bottom: 1px solid #00ff66;
              padding-bottom: 8px;
            }
            .info-card {
              width: 100%;
              max-width: 900px;
              border: 1px dashed #00ff66;
              padding: 12px;
              margin-bottom: 15px;
              background: rgba(0, 20, 0, 0.4);
              box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
              text-shadow: 0 0 4px rgba(0, 255, 102, 0.6);
              white-space: pre-wrap;
              line-height: 1.4;
            }
            .info-title {
              font-weight: bold;
              text-decoration: underline;
              margin-bottom: 5px;
            }
            .content-box {
              width: 100%;
              max-width: 900px;
              display: flex;
              justify-content: center;
              align-items: center;
              background: #000;
              padding: 10px;
              box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            }
          </style>
        </head>
        <body>
          <div class="crt-overlay"></div>
          <div class="header">
            [H.O.L.M.E.S. ARCHIVE FILE VIEWPORT]
          </div>
          
          <div class="info-card">
            <div class="info-title">RECORD INFORMATION</div>
            ID:          ${record.id}
            TITLE:       ${record.title}
            CATEGORY:    ${record.category}
            ACTIVE FILE: ${attachment.fileName} (${attachment.fileType})
            --------------------------------------------------
            DETAILS:
            ${record.details}
            --------------------------------------------------
            RECORD ATTACHMENTS (${files.length}):
${fileListHTML}
          </div>

          <div class="content-box">
            ${contentElement}
          </div>
        </body>
        </html>
      `;

      newTab.document.open();
      newTab.document.write(retroPageHTML);
      newTab.document.close();
    }

    // Multi-step Interactive ADD process
    function handleAddProcess(inputVal) {
      if (entryStep === 1) {
        if (!inputVal) return printLine("Title cannot be empty. Enter Title:");
        tempEntry.title = inputVal;
        entryStep = 2;
        printLine("Enter Category:");
      } else if (entryStep === 2) {
        tempEntry.category = inputVal || "UNASSIGNED";
        entryStep = 3;
        printLine("Enter Record Details:");
      } else if (entryStep === 3) {
        tempEntry.details = inputVal || "No details provided.";
        entryStep = 4;
        printLine("Attach files? Select multiple in prompt or skip (Y/N):");
      } else if (entryStep === 4) {
        const choice = inputVal.toUpperCase();
        if (choice === 'Y' || choice === 'YES') {
          attachInput.click();
        } else {
          showLoadingBar("SAVING NEW RECORD", () => {
            finalizeRecord();
          });
        }
      }
    }

    function finalizeRecord() {
      const nextNum = String(database.length + 1).padStart(3, '0');
      tempEntry.id = `REC-${nextNum}`;
      database.push(tempEntry);
      saveData();
      printLine(`[SUCCESS] RECORD SAVED AS ${tempEntry.id}`);
      entryMode = false;
      entryStep = 0;
      tempEntry = {};
    }

    // Multi-file Attachment Handler with Size Check
    attachInput.addEventListener('change', e => {
      const files = Array.from(e.target.files);
      if (files.length === 0) {
        showLoadingBar("SAVING NEW RECORD", () => {
          finalizeRecord();
        });
        return;
      }

      showLoadingBar("PROCESSING ATTACHMENT(S)", () => {
        let loadedCount = 0;
        files.forEach(file => {
          if (file.size > MAX_SINGLE_FILE_SIZE) {
            printLine("--------------------------------------------------");
            printLine(`ERROR: SKIPPING [${file.name}] - FILE TOO BIG.`);
            printLine(`MAX ALLOWED: 2.00 MB | FILE SIZE: ${(file.size / (1024 * 1024)).toFixed(2)} MB`);
            printLine("--------------------------------------------------");
            loadedCount++;
            if (loadedCount === files.length) finalizeRecord();
            return;
          }

          const reader = new FileReader();
          reader.onload = event => {
            tempEntry.attachments.push({
              fileName: file.name,
              fileType: file.type || 'application/octet-stream',
              fileData: event.target.result
            });
            printLine(`[ATTACHED] ${file.name} (${Math.round(file.size / 1024)} KB)`);
            loadedCount++;
            if (loadedCount === files.length) {
              attachInput.value = '';
              finalizeRecord();
            }
          };
          reader.readAsDataURL(file);
        });
      });
    });

    // File Import Handler
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      showLoadingBar(`IMPORTING DATABASE FROM [${file.name.toUpperCase()}]`, () => {
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {
              database = importedData;
              saveData();
              printLine("DATABASE IMPORT SUCCESSFUL. RECORDS UPDATED.");
            } else {
              printLine("ERROR: Invalid file format. Expected a JSON array.");
            }
          } catch (err) {
            printLine("ERROR: Failed to parse backup file.");
          }
        };
        reader.readAsText(file);
      });
    });
  </script>
</body>
</html>
